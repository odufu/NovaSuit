publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: '>=3.0.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  novasuite_core:
    path: ../../packages/novasuite_core
  supabase_flutter: ^2.0.0
  flutter_bloc: ^8.1.3
  provider: ^6.1.1
  google_fonts: ^6.1.0
  intl: ^0.19.0
  image_picker: ^1.0.7
  cupertino_icons: ^1.0.6

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^3.0.0

flutter:
  uses-material-design: true
