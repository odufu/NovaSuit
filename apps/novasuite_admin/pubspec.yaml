name: novasuite_admin
description: Responsive Enterprise Web & Desktop Admin Dashboard for NovaSuite CRM & NovaExpress Logistics.
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: '>=3.0.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  novasuite_core:
    path: ../../packages/novasuite_core
  supabase_flutter: ^2.0.0
  flutter_bloc: ^9.0.0
  provider: ^6.1.1
  get_it: ^7.6.0
  equatable: ^2.0.5
  google_fonts: ^6.1.0
  intl: ^0.19.0

dependency_overrides:
  intl: ^0.19.0
  flutter_webrtc: ^0.12.0
  flutter_svg: ^2.0.10+1
  cupertino_icons: ^1.0.6

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^3.0.0

flutter:
  uses-material-design: true
