<!DOCTYPE html>
<html>
<head>
  <base href="$FLUTTER_BASE_HREF">

  <meta charset="UTF-8">
  <meta content="IE=Edge" http-equiv="X-UA-Compatible">
  <meta name="description" content="NovaSuite White-Label CRM Admin Portal">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">

  <!-- iOS meta tags & icons -->
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="NovaSuite Admin">
  <link rel="apple-touch-icon" href="icons/Icon-192.png">

  <!-- Favicon -->
  <link rel="icon" type="image/png" href="favicon.png"/>

  <!-- Google Fonts Pre-connect & Fast DNS Resolution -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>

  <title>NovaSuite Enterprise Portal</title>
  <link rel="manifest" href="manifest.json">

  <style>
    body {
      margin: 0;
      padding: 0;
      background-color: #09140E;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
      overflow: hidden;
    }
    #app-loading-screen {
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      height: 100vh;
      width: 100vw;
      background: linear-gradient(135deg, #09140E 0%, #0C1F17 100%);
      color: #FFFFFF;
    }
    .loading-spinner {
      width: 48px;
      height: 48px;
      border: 4px solid rgba(16, 185, 129, 0.15);
      border-left-color: #10B981;
      border-radius: 50%;
      animation: spin 0.8s linear infinite;
    }
    .loading-title {
      margin-top: 20px;
      font-size: 18px;
      font-weight: 700;
      letter-spacing: 0.5px;
      color: #10B981;
    }
    .loading-sub {
      margin-top: 6px;
      font-size: 12px;
      color: #94A3B8;
    }
    @keyframes spin {
      0% { transform: rotate(0deg); }
      100% { transform: rotate(360deg); }
    }
  </style>
</head>
<body>
  <div id="app-loading-screen">
    <div class="loading-spinner"></div>
    <div class="loading-title">NOVASUITE</div>
    <div class="loading-sub">Loading Enterprise Console...</div>
  </div>
  <script>
    // Smoothly fade out and remove loading screen on first Flutter frame
    window.addEventListener('flutter-first-frame', function () {
      var loader = document.getElementById('app-loading-screen');
      if (loader) {
        loader.style.opacity = '0';
        loader.style.transition = 'opacity 0.3s ease';
        setTimeout(function() {
          loader.remove();
        }, 300);
      }
    });

    // Fallback: Remove loader after max 5s if frame event was missed
    setTimeout(function() {
      var loader = document.getElementById('app-loading-screen');
      if (loader) {
        loader.remove();
      }
    }, 5000);
  </script>
  <script src="flutter_bootstrap.js" async></script>
</body>
</html>
